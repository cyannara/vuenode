name: Build Vue and Deploy Node App

#on:
#  push:
#    branches:
#      - main

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Build Vue app
        working-directory: frontapp
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # 서버에 접속하여 배포 실행
      - name: SSH into server and deploy
        run: |
          scp -r -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no frontapp/dist/* ${{ secrets.USER }}@${{ secrets.HOST }}:/home/${{ secrets.USER }}/app/backapp/public/      
          ssh -vvv -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no  ${{ secrets.USER }}@${{ secrets.HOST }} << 'EOF'
              cd ~/app
              git pull origin main
              cd backapp
              npm ci
              pm2 restart app || pm2 start app.js --name "app"
              pm2 save
            EOF

          echo '== build end ==='
